name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Windows)
    # WPF (net10.0-windows) собирается и тестируется только на Windows-раннере.
    runs-on: windows-latest
    # Зависший шаг не должен держать раннер часами: обычный прогон занимает
    # минуты, получасовой предел оставляет запас на холодный кэш.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Полная история: версионирование из git-тегов (git describe для
          # коммитов без тега; см. build/Get-GitVersion.ps1).
          fetch-depth: 0

      # Пункт 1.5: TFM net10.0-windows — нужен .NET 10 SDK (включает Windows Desktop runtime).
      # setup-dotnet ставит точную версию независимо от содержимого образа раннера.
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # Версия пакета разработки берётся из global.json: раннер собирает
          # тем же набором инструментов, что и разработчик.
          global-json-file: global.json
          # Кэш пакетов NuGet между прогонами. Ключ — по файлам-замкам
          # зависимостей: они перечисляют точное дерево пакетов, поэтому кэш
          # обновляется ровно тогда, когда меняются сами зависимости.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Репозиторного NuGet.config нет — раннер восстанавливает пакеты из nuget.org
      # по умолчанию (все используемые пакеты там доступны).
      - name: Restore
        run: dotnet restore GCodeGenerator.sln --locked-mode

      # Публикация восстанавливает пакеты под средой выполнения, и это
      # отдельный раздел замка. Здесь он проверяется без самой публикации:
      # шаг занимает секунды, а ловит ровно то расхождение, из-за которого
      # сборка инсталлятора шла мимо закреплённого состава пакетов.
      # Полноту разделов и закреплённый режим публикации держит также тест
      # PackageLockTests — этот шаг проверяет, что восстановление и правда
      # проходит, а не только что разделы на месте.
      - name: Restore for publish (win-x64, locked)
        run: dotnet restore GCodeGenerator/GCodeGenerator.csproj -r win-x64 --locked-mode

      - name: Build (Release)
        run: dotnet build GCodeGenerator.sln -c Release --no-restore -warnaserror

      # Архитектурные правила — чистота ядра и view-моделей от WPF,
      # запрет ввода-вывода и кириллицы в view-моделях, пофайловая
      # директива #nullable — живут в тестах (CoreAssemblyPurityTests,
      # ArchitectureRulesTests): они выполняются и локально, и здесь,
      # а проверка ссылок собранной сборки не обходится полным именем
      # типа, как обходились прежние регэкспы этого файла.

      # Тесты ядра не ссылаются на приложение и собираются под net10.0:
      # их прохождение подтверждает, что ядро работает без WPF.
      # TRX-отчёты и покрытие складываются в артефакт: упавший тест можно
      # разобрать по отчёту, не воспроизводя прогон на своей машине.
      - name: Run core tests
        run: >
          dotnet test GCodeGenerator.Core.Tests/GCodeGenerator.Core.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=core-tests.trx"
          --collect "Code Coverage"
          --results-directory TestResults

      - name: Run application tests
        run: >
          dotnet test GCodeGenerator.Tests/GCodeGenerator.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=app-tests.trx"
          --collect "Code Coverage"
          --results-directory TestResults

      # Отчёты выгружаются и при падении тестов — ради него они и нужны.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: TestResults
          retention-days: 14

      # Известные уязвимости в дереве пакетов — прямых и транзитивных.
      #
      # Шаг стоит после тестов намеренно: уязвимость в зависимости зависимости
      # приходит не из проверяемого изменения, и прятать за ней результат
      # тестов значило бы отнимать у автора единственный полезный сигнал.
      # Прогон при этом всё равно падает — красный CI и есть смысл проверки.
      #
      # Выполняется всегда: уязвимость не перестаёт существовать оттого,
      # что упал тест.
      - name: Check for vulnerable packages
        if: always()
        shell: pwsh
        run: build/Test-VulnerablePackages.ps1
