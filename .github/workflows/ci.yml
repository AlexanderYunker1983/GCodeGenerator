name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Windows)
    # WPF (net10.0-windows) собирается и тестируется только на Windows-раннере.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история: версионирование из git-тегов (git describe для
          # коммитов без тега; см. build/Get-GitVersion.ps1).
          fetch-depth: 0

      # Пункт 1.5: TFM net10.0-windows — нужен .NET 10 SDK (включает Windows Desktop runtime).
      # setup-dotnet ставит точную версию независимо от содержимого образа раннера.
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          # Версия пакета разработки берётся из global.json: раннер собирает
          # тем же набором инструментов, что и разработчик.
          global-json-file: global.json

      # Репозиторного NuGet.config нет — раннер восстанавливает пакеты из nuget.org
      # по умолчанию (все используемые пакеты там доступны).
      - name: Restore
        run: dotnet restore GCodeGenerator.sln --locked-mode

      - name: Build (Release)
        run: dotnet build GCodeGenerator.sln -c Release --no-restore -warnaserror

      # Архитектурные правила — чистота ядра и view-моделей от WPF,
      # запрет ввода-вывода и кириллицы в view-моделях, пофайловая
      # директива #nullable — живут в тестах (CoreAssemblyPurityTests,
      # ArchitectureRulesTests): они выполняются и локально, и здесь,
      # а проверка ссылок собранной сборки не обходится полным именем
      # типа, как обходились прежние регэкспы этого файла.

      # Тесты ядра не ссылаются на приложение и собираются под net10.0:
      # их прохождение подтверждает, что ядро работает без WPF.
      - name: Run core tests
        run: dotnet test GCodeGenerator.Core.Tests/GCodeGenerator.Core.Tests.csproj -c Release --no-build

      - name: Run application tests
        run: dotnet test GCodeGenerator.Tests/GCodeGenerator.Tests.csproj -c Release --no-build
