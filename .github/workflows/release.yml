name: Release

# Релиз по тегу: push тега формата X.Y.Z[-suffix] (1.2.3, 1.2.3-rc5, ...)
# собирает инсталлятор (Inno Setup) и публикует GitHub Release с артефактами.
# Теги вне формата игнорируются (шаг Validate tag).
# Версия инсталлятора — из тега (build/Get-GitVersion.ps1, тот же механизм,
# что и версия сборки; см. README, «Версионирование»).
on:
  push:
    tags:
      - '*'
  # Ручная репетиция выполняет весь build/package/smoke-контур на hosted
  # runner, но jobs attest и publish ниже разрешены только событию push.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version from CHANGELOG to use for rehearsal artifacts'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    # Полный quality gate, self-contained publish и upgrade-smoke занимают
    # существенно больше обычного CI; вложенные процессы имеют свои таймауты.
    timeout-minutes: 150
    outputs:
      skip: ${{ steps.tag.outputs.skip }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Полная история: версионирование из git-тегов (см. build/Get-GitVersion.ps1).
          fetch-depth: 0

      - name: Validate tag
        id: tag
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          if ($tag -notmatch '^\d+\.\d+\.\d+(-[A-Za-z][A-Za-z0-9]*)?$') {
            Write-Host "Tag '$tag' does not match the version format X.Y.Z[-suffix] - skipping release."
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'skip=true'
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'prerelease=false'
          }
          else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'skip=false'
            if ($tag.Contains('-')) { Add-Content -Path $env:GITHUB_OUTPUT -Value 'prerelease=true' }
            else { Add-Content -Path $env:GITHUB_OUTPUT -Value 'prerelease=false' }
          }

      - name: Setup .NET 10
        if: steps.tag.outputs.skip == 'false'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # Версия пакета разработки берётся из global.json: раннер собирает
          # тем же набором инструментов, что и разработчик.
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Тег не должен выпускать старый, экспериментальный или неслитый коммит.
      # Сравниваются commit-объекты, поэтому работают и lightweight-, и
      # annotated-теги. Для выпуска нужен именно актуальный HEAD master.
      - name: Verify tag points to current master
        if: steps.tag.outputs.skip == 'false' && github.event_name == 'push'
        shell: pwsh
        run: build/Assert-ReleaseTagAtMaster.ps1 -Tag $env:TAG_NAME

      - name: Restore
        if: steps.tag.outputs.skip == 'false'
        run: dotnet restore GCodeGenerator.sln --locked-mode

      - name: Restore for publish (win-x64, locked)
        if: steps.tag.outputs.skip == 'false'
        run: dotnet restore GCodeGenerator/GCodeGenerator.csproj -r win-x64 --locked-mode

      - name: Build (Release)
        if: steps.tag.outputs.skip == 'false'
        run: dotnet build GCodeGenerator.sln -c Release --no-restore -warnaserror

      # Release повторяет исполняемые quality gates обычного CI на том же
      # commit, который затем будет упакован. Один лишь факт существования
      # отдельного CI-run недостаточен: его можно отменить или обойти тегом.
      - name: Run core tests
        id: core_tests
        if: steps.tag.outputs.skip == 'false'
        run: >
          dotnet test GCodeGenerator.Core.Tests/GCodeGenerator.Core.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=core-tests.trx"
          --collect "Code Coverage;Format=cobertura"
          --results-directory TestResults/core

      - name: Run application tests
        id: app_tests
        if: steps.tag.outputs.skip == 'false'
        run: >
          dotnet test GCodeGenerator.Tests/GCodeGenerator.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=app-tests.trx"
          --collect "Code Coverage;Format=cobertura"
          --results-directory TestResults/app

      - name: Upload test results
        if: >-
          always() && steps.tag.outputs.skip == 'false' &&
          (steps.core_tests.outcome != 'skipped' || steps.app_tests.outcome != 'skipped')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-test-results
          path: TestResults
          if-no-files-found: ${{ steps.core_tests.outcome == 'success' && steps.app_tests.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 14

      - name: Enforce coverage thresholds
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: |
          build/Assert-Coverage.ps1 `
            -ResultsDirectory TestResults/core `
            -Assembly GCodeGenerator.Core `
            -MinimumLinePercent 80 `
            -MinimumBranchPercent 65
          build/Assert-Coverage.ps1 `
            -ResultsDirectory TestResults/app `
            -Assembly GCodeGenerator `
            -MinimumLinePercent 80 `
            -MinimumBranchPercent 65

      - name: Check for vulnerable packages
        if: always() && steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: build/Test-VulnerablePackages.ps1

      - name: Restore pinned mutation tool
        if: steps.tag.outputs.skip == 'false'
        run: dotnet tool restore

      - name: Run mutation tests
        id: mutation_tests
        if: steps.tag.outputs.skip == 'false'
        working-directory: GCodeGenerator.Core.Tests
        run: dotnet stryker --config-file stryker-config.json --skip-version-check

      - name: Upload mutation report
        if: always() && steps.mutation_tests.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-mutation-report
          path: GCodeGenerator.Core.Tests/StrykerOutput
          if-no-files-found: ${{ steps.mutation_tests.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 30

      # Inno Setup удалён из образа windows-2025 (windows-latest) — ставим
      # официальный инсталлятор с закреплённой версией (immutable GitHub release).
      - name: Install Inno Setup 7.1.0 (x64)
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $expectedSha256 = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 5
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Remove-Item -LiteralPath $installer -Force
            throw "Inno Setup SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }

          $authenticode = Get-AuthenticodeSignature -LiteralPath $installer
          if ($authenticode.Status -ne 'Valid' -or
              $authenticode.SignerCertificate.Subject -notmatch '(^|,\s*)O=Pyrsys B\.V\.(,|$)' -or
              $null -eq $authenticode.TimeStamperCertificate) {
            throw "Inno Setup Authenticode verification failed: $($authenticode.Status); $($authenticode.SignerCertificate.Subject)"
          }
          gh release verify-asset is-7_1_0 $installer --repo jrsoftware/issrc
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup GitHub release attestation is invalid.' }

          $installProcess = Start-Process -FilePath $installer `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS') `
            -WindowStyle Hidden `
            -PassThru
          try {
            if (-not $installProcess.WaitForExit(300000)) {
              throw 'Inno Setup installation timed out after 300 seconds.'
            }
            if ($installProcess.ExitCode -ne 0) {
              throw "Inno Setup installation failed with exit code $($installProcess.ExitCode)"
            }
          }
          finally {
            if (-not $installProcess.HasExited) {
              Stop-Process -Id $installProcess.Id -Force -ErrorAction SilentlyContinue
            }
            $installProcess.Dispose()
          }
          $iscc = 'C:\Program Files\Inno Setup 7\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup installation failed: $iscc not found" }
          Write-Host "ISCC ready: $iscc"

      # До появления публично доверенного сертификата политика выпуска явно
      # unsigned. Workflow не получает секреты подписи: они не могут утечь в
      # запускаемый upgrade-smoke и случайно изменить свойства артефакта.
      # Целостность компенсируется checksums, attestation и immutable release.
      - name: Build installer
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: build/Make-Installer.ps1 -SigningMode Unsigned

      # Портативная версия (без инсталлятора) — тот же publish-каталог.
      - name: Build portable zip
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: |
          $zip = "artifacts/installer/GCodeGenerator-$env:TAG_NAME-win-x64-portable.zip"
          Compress-Archive -Path 'artifacts/publish/GCodeGenerator/*' -DestinationPath $zip
          Write-Host "Portable: $zip"

      # Обновление проверяется не повторной установкой того же файла, а
      # переходом с последнего опубликованного выпуска на текущий кандидат.
      - name: Download previous release installer
        if: steps.tag.outputs.skip == 'false'
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list `
            --repo $env:GITHUB_REPOSITORY `
            --limit 100 `
            --json tagName,isDraft,publishedAt | ConvertFrom-Json
          $candidates = @($releases |
            Where-Object { -not $_.isDraft -and $_.tagName -ne $env:TAG_NAME } |
            Sort-Object publishedAt -Descending)
          if ($candidates.Count -eq 0) {
            throw 'No previous published release is available for upgrade smoke testing.'
          }

          $downloadRoot = Join-Path $env:RUNNER_TEMP 'gcodegen-previous-release'
          New-Item -ItemType Directory -Path $downloadRoot | Out-Null
          # 0.4.1-rc1 опубликован до включения immutable releases и не имеет
          # release attestation. Это единственное legacy-исключение: имя и
          # digest сняты с уже проверенного публичного артефакта и закреплены
          # в workflow. Все последующие источники обновления обязаны быть
          # immutable и проходить криптографическую проверку GitHub.
          $trustedLegacyInstallers = @{
            '0.4.1-rc1' = @{
              Name = 'GCodeGenerator-Setup-0.4.1-rc1.exe'
              Sha256 = '55c92678f32d500d103f40a777cc93c182d030b63fbf776acffe8a067cdaac6f'
            }
          }
          $previousInstaller = $null
          $candidateIndex = 0
          foreach ($candidate in $candidates) {
            $release = gh release view $candidate.tagName `
              --repo $env:GITHUB_REPOSITORY `
              --json assets,isImmutable | ConvertFrom-Json
            $installerAssets = @($release.assets |
              Where-Object { $_.name -match '^GCodeGenerator-Setup-.+\.exe$' })
            if ($installerAssets.Count -ne 1) {
              continue
            }

            $candidateIndex++
            $downloadDirectory = Join-Path $downloadRoot $candidateIndex
            New-Item -ItemType Directory -Path $downloadDirectory | Out-Null
            $downloaded = $false
            for ($downloadAttempt = 1; $downloadAttempt -le 3; $downloadAttempt++) {
              gh release download $candidate.tagName `
                --repo $env:GITHUB_REPOSITORY `
                --pattern $installerAssets[0].name `
                --dir $downloadDirectory `
                --clobber
              if ($LASTEXITCODE -eq 0) {
                $downloaded = $true
                break
              }
              if ($downloadAttempt -lt 3) {
                Write-Warning "Downloading previous installer failed (attempt $downloadAttempt of 3); retrying."
                Start-Sleep -Seconds (5 * $downloadAttempt)
              }
            }
            if (-not $downloaded) {
              throw "Downloading the previous installer from $($candidate.tagName) failed."
            }
            $previousInstaller = Join-Path $downloadDirectory $installerAssets[0].name
            $legacyTrust = $trustedLegacyInstallers[$candidate.tagName]
            if ($null -ne $legacyTrust) {
              if ($installerAssets[0].name -cne $legacyTrust.Name) {
                throw "Legacy installer name for $($candidate.tagName) is not pinned: $($installerAssets[0].name)"
              }
              $actualSha256 = (Get-FileHash -LiteralPath $previousInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualSha256 -cne $legacyTrust.Sha256) {
                throw "Legacy installer SHA-256 mismatch for $($candidate.tagName): expected $($legacyTrust.Sha256), got $actualSha256"
              }
              Write-Host "Previous legacy release verified by pinned SHA-256: $($candidate.tagName)"
            }
            elseif ($release.isImmutable) {
              gh release verify $candidate.tagName --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) {
                throw "Release attestation is invalid for $($candidate.tagName)."
              }
              gh release verify-asset $candidate.tagName $previousInstaller --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) {
                throw "Release asset attestation is invalid for $($candidate.tagName)."
              }
              Write-Host "Previous immutable release and installer verified: $($candidate.tagName)"
            }
            else {
              throw "Previous release $($candidate.tagName) is mutable and has no pinned legacy installer digest."
            }
            break
          }
          if ($null -eq $previousInstaller) {
            throw 'No previous release contains exactly one installer asset.'
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$previousInstaller"

      # Проверяется именно упакованный продукт: тихая установка, запуск,
      # повторная установка с тем же AppId, portable и деинсталляция.
      - name: Smoke-test packaged artifacts
        id: packaged_smoke
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem artifacts/installer/GCodeGenerator-Setup-*.exe -File -ErrorAction Stop).FullName
          $portableArchive = (Get-ChildItem artifacts/installer/GCodeGenerator-*-portable.zip -File -ErrorAction Stop).FullName
          $work = Join-Path $env:RUNNER_TEMP "gcodegen-package-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $smoke = @{
            InstallerPath = $installer
            PreviousInstallerPath = '${{ steps.previous.outputs.path }}'
            PortableArchivePath = $portableArchive
            WorkRoot = $work
            OutputLog = 'artifacts/installer/packaged-artifact-smoke.log'
          }
          build/Test-PackagedArtifacts.ps1 @smoke

      # Диагностика сохраняется и при падении smoke-теста; общий release
      # bundle ниже создаётся лишь после полностью успешной сборки.
      - name: Upload packaged artifact smoke log
        if: always() && steps.packaged_smoke.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-artifact-smoke
          path: artifacts/installer/packaged-artifact-smoke.log
          if-no-files-found: ${{ steps.packaged_smoke.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 14

      - name: Create CycloneDX SBOM
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: |
          $sbom = "artifacts/installer/GCodeGenerator-$env:TAG_NAME-sbom.cdx.json"
          build/New-ReleaseSbom.ps1 `
            -Project GCodeGenerator/GCodeGenerator.csproj `
            -Version $env:TAG_NAME `
            -OutputPath $sbom

      - name: Create SHA-256 checksums
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: build/New-ReleaseChecksums.ps1 -Directory artifacts/installer

      # Описание выпуска берётся только из CHANGELOG: раздел с номером версии
      # написан для пользователя, а список коммитов — для разработчика.
      # Отсутствующий или пустой раздел останавливает выпуск.
      - name: Release notes from CHANGELOG
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: |
          $file = 'artifacts/installer/release-notes.md'
          build/Get-ReleaseNotes.ps1 -Tag $env:TAG_NAME -OutFile $file | Out-Null
          if (-not (Test-Path -LiteralPath $file)) { throw "Release notes were not created: $file" }
          Write-Host "Release notes: $file"

      # Job публикации не получает исходный checkout, компилятор или скачанный
      # Inno Setup: через границу прав передаются только готовые файлы выпуска.
      - name: Upload release bundle
        if: steps.tag.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle
          path: artifacts/installer
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest Release Provenance
    needs: build
    if: needs.build.outputs.skip == 'false' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: release-assets

      # Подписанная Sigstore/SLSA provenance связывает точные хеши из файла
      # с этим workflow, commit и репозиторием. Сборочный job OIDC не получает.
      - name: Attest release files
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: release-assets/SHA256SUMS.txt

  publish:
    name: Publish Release
    needs: [build, attest]
    if: needs.build.outputs.skip == 'false' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: release-assets

      # Immutable releases защищают tag и assets только после публикации,
      # поэтому сначала создаётся полностью заполненный draft. Перезапись уже
      # загруженных файлов запрещена: повторный запуск не может тихо подменить
      # артефакт с тем же именем.
      - name: Create complete draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: ${{ github.ref_name }}
          files: |
            release-assets/GCodeGenerator-Setup-*.exe
            release-assets/GCodeGenerator-*-portable.zip
            release-assets/GCodeGenerator-*-sbom.cdx.json
            release-assets/SHA256SUMS.txt
          # Тег с суффиксом (-alpha/-beta/-rc) — pre-release.
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          body_path: release-assets/release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          draft: true
          overwrite_files: false

      - name: Publish completed draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the completed draft release failed.' }

      # Repository Settings > Releases > Immutable releases must be enabled.
      # GitHub creates the signed release attestation asynchronously. Проверка
      # ждёт до пяти минут; immutable release после публикации нельзя и не надо
      # пытаться вернуть в draft — при задержке нужна ручная verify, не повтор
      # publish-job с созданием второго черновика.
      - name: Verify immutable release and every uploaded asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVerified = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            gh release verify $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -eq 0) {
              $releaseVerified = $true
              break
            }
            if ($attempt -lt 30) { Start-Sleep -Seconds 10 }
          }
          if (-not $releaseVerified) {
            $releaseState = gh release view $env:GITHUB_REF_NAME `
              --repo $env:GITHUB_REPOSITORY `
              --json isImmutable,isDraft,url | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $null -eq $releaseState) {
              throw 'Release attestation verification timed out and the published release state could not be read. Do not rerun publish; inspect the release manually.'
            }
            if ($releaseState.isImmutable) {
              throw "Immutable release attestation was not verifiable within five minutes. Do not rerun publish. Verify manually: gh release verify $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY ($($releaseState.url))"
            }
            if (-not $releaseState.isDraft) {
              gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft
              if ($LASTEXITCODE -ne 0) {
                throw 'Release attestation verification failed and the mutable release could not be returned to draft. Do not rerun publish; inspect the release manually.'
              }
            }
            throw 'Published release has no immutable release attestation and remains a draft. Enable immutable releases, then use a new tag.'
          }

          $uploadedAssets = @(
            Get-ChildItem 'release-assets/GCodeGenerator-Setup-*.exe' -File -ErrorAction Stop
            Get-ChildItem 'release-assets/GCodeGenerator-*-portable.zip' -File -ErrorAction Stop
            Get-ChildItem 'release-assets/GCodeGenerator-*-sbom.cdx.json' -File -ErrorAction Stop
            Get-Item 'release-assets/SHA256SUMS.txt' -ErrorAction Stop
          )
          foreach ($asset in $uploadedAssets) {
            gh release verify-asset $env:GITHUB_REF_NAME $asset.FullName --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "Immutable release asset verification failed: $($asset.Name)"
            }
          }
