name: Release

# Релиз по тегу: push тега формата X.Y.Z[-suffix] (1.2.3, 1.2.3-rc5, ...)
# собирает инсталлятор (Inno Setup) и публикует GitHub Release с артефактами.
# Теги вне формата игнорируются (шаг Validate tag).
# Версия инсталлятора — из тега (build/Get-GitVersion.ps1, тот же механизм,
# что и версия сборки; см. README, «Версионирование»).
on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      skip: ${{ steps.tag.outputs.skip }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      notes_found: ${{ steps.notes.outputs.found }}
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Полная история: версионирование из git-тегов (см. build/Get-GitVersion.ps1).
          fetch-depth: 0

      - name: Validate tag
        id: tag
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          if ($tag -notmatch '^\d+\.\d+\.\d+(-[A-Za-z][A-Za-z0-9]*)?$') {
            Write-Host "Tag '$tag' does not match the version format X.Y.Z[-suffix] - skipping release."
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'skip=true'
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'prerelease=false'
          }
          else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'skip=false'
            if ($tag.Contains('-')) { Add-Content -Path $env:GITHUB_OUTPUT -Value 'prerelease=true' }
            else { Add-Content -Path $env:GITHUB_OUTPUT -Value 'prerelease=false' }
          }

      - name: Setup .NET 10
        if: steps.tag.outputs.skip == 'false'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # Версия пакета разработки берётся из global.json: раннер собирает
          # тем же набором инструментов, что и разработчик.
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Тег не должен выпускать старый, экспериментальный или неслитый коммит.
      # Сравниваются commit-объекты, поэтому работают и lightweight-, и
      # annotated-теги. Для выпуска нужен именно актуальный HEAD master.
      - name: Verify tag points to current master
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: |
          git fetch origin master --no-tags
          $tagCommit = (git rev-list -n 1 --verify "refs/tags/$env:TAG_NAME").Trim()
          $masterCommit = (git rev-parse refs/remotes/origin/master).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit) -or
              [string]::IsNullOrWhiteSpace($masterCommit)) {
            throw 'Cannot resolve the release tag or origin/master.'
          }
          if ($tagCommit -ne $masterCommit) {
            throw "Release tag points to $tagCommit, but current origin/master is $masterCommit."
          }
          Write-Host "Release commit is current origin/master: $tagCommit"

      - name: Restore
        if: steps.tag.outputs.skip == 'false'
        run: dotnet restore GCodeGenerator.sln --locked-mode

      - name: Restore for publish (win-x64, locked)
        if: steps.tag.outputs.skip == 'false'
        run: dotnet restore GCodeGenerator/GCodeGenerator.csproj -r win-x64 --locked-mode

      - name: Build (Release)
        if: steps.tag.outputs.skip == 'false'
        run: dotnet build GCodeGenerator.sln -c Release --no-restore -warnaserror

      # Release повторяет исполняемые quality gates обычного CI на том же
      # commit, который затем будет упакован. Один лишь факт существования
      # отдельного CI-run недостаточен: его можно отменить или обойти тегом.
      - name: Run core tests
        if: steps.tag.outputs.skip == 'false'
        run: >
          dotnet test GCodeGenerator.Core.Tests/GCodeGenerator.Core.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=core-tests.trx"
          --collect "Code Coverage;Format=cobertura"
          --results-directory TestResults/core

      - name: Run application tests
        if: steps.tag.outputs.skip == 'false'
        run: >
          dotnet test GCodeGenerator.Tests/GCodeGenerator.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=app-tests.trx"
          --collect "Code Coverage;Format=cobertura"
          --results-directory TestResults/app

      - name: Upload test results
        if: always() && steps.tag.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-test-results
          path: TestResults
          retention-days: 14

      - name: Enforce coverage thresholds
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: |
          build/Assert-Coverage.ps1 `
            -ResultsDirectory TestResults/core `
            -Assembly GCodeGenerator.Core `
            -MinimumLinePercent 80 `
            -MinimumBranchPercent 65
          build/Assert-Coverage.ps1 `
            -ResultsDirectory TestResults/app `
            -Assembly GCodeGenerator `
            -MinimumLinePercent 80 `
            -MinimumBranchPercent 65

      - name: Check for vulnerable packages
        if: always() && steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: build/Test-VulnerablePackages.ps1

      - name: Restore pinned mutation tool
        if: steps.tag.outputs.skip == 'false'
        run: dotnet tool restore

      - name: Run mutation tests
        if: steps.tag.outputs.skip == 'false'
        working-directory: GCodeGenerator.Core.Tests
        run: dotnet stryker --config-file stryker-config.json --skip-version-check

      - name: Upload mutation report
        if: always() && steps.tag.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-mutation-report
          path: GCodeGenerator.Core.Tests/StrykerOutput
          if-no-files-found: error
          retention-days: 30

      # Inno Setup удалён из образа windows-2025 (windows-latest) — ставим
      # официальный инсталлятор с закреплённой версией (immutable GitHub release).
      - name: Install Inno Setup 6.7.3
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $expectedSha256 = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Remove-Item -LiteralPath $installer -Force
            throw "Inno Setup SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup installation failed: $iscc not found" }
          Write-Host "ISCC ready: $iscc"

      # publish (self-contained win-x64, рантайм в составе) + ISCC с версией из тега.
      #
      # Подпись кода. Секрет SIGN_COMMAND — командная строка, подписывающая один
      # файл, где $f заменяется путём к нему (тот же placeholder, что у Inno
      # Setup, поэтому одна настройка покрывает и программу, и инсталлятор):
      #   signtool.exe sign /fd SHA256 /tr <служба меток времени> /td SHA256 ... $f
      # Секрета нет — pre-release собирается с явным предупреждением, а
      # стабильный выпуск останавливается: распространять его неподписанным
      # workflow не позволяет. Сертификат в репозитории лежать не может:
      # секрет SIGNER_THUMBPRINT закрепляет ожидаемый сертификат, чтобы
      # успешная команда не могла подписать выпуск случайным ключом.
      # добавить секрет, а для сертификата в файле — ещё и шаг, который пишет
      # .pfx из секрета во временный файл перед этим шагом.
      - name: Build installer
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        env:
          GCODEGEN_SIGN_COMMAND: ${{ secrets.SIGN_COMMAND }}
          GCODEGEN_EXPECTED_SIGNER_THUMBPRINT: ${{ secrets.SIGNER_THUMBPRINT }}
        run: build/Make-Installer.ps1

      # Портативная версия (без инсталлятора) — тот же publish-каталог.
      - name: Build portable zip
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: |
          $zip = "artifacts/installer/GCodeGenerator-$env:TAG_NAME-win-x64-portable.zip"
          Compress-Archive -Path 'artifacts/publish/GCodeGenerator/*' -DestinationPath $zip
          Write-Host "Portable: $zip"

      # Обновление проверяется не повторной установкой того же файла, а
      # переходом с последнего опубликованного выпуска на текущий кандидат.
      - name: Download previous release installer
        if: steps.tag.outputs.skip == 'false'
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list `
            --repo $env:GITHUB_REPOSITORY `
            --limit 100 `
            --json tagName,isDraft,publishedAt | ConvertFrom-Json
          $candidates = @($releases |
            Where-Object { -not $_.isDraft -and $_.tagName -ne $env:TAG_NAME } |
            Sort-Object publishedAt -Descending)
          if ($candidates.Count -eq 0) {
            throw 'No previous published release is available for upgrade smoke testing.'
          }

          $downloadRoot = Join-Path $env:RUNNER_TEMP 'gcodegen-previous-release'
          New-Item -ItemType Directory -Path $downloadRoot | Out-Null
          $previousInstaller = $null
          $candidateIndex = 0
          foreach ($candidate in $candidates) {
            $release = gh release view $candidate.tagName `
              --repo $env:GITHUB_REPOSITORY `
              --json assets | ConvertFrom-Json
            $installerAssets = @($release.assets |
              Where-Object { $_.name -match '^GCodeGenerator-Setup-.+\.exe$' })
            if ($installerAssets.Count -ne 1) {
              continue
            }

            $candidateIndex++
            $downloadDirectory = Join-Path $downloadRoot $candidateIndex
            New-Item -ItemType Directory -Path $downloadDirectory | Out-Null
            gh release download $candidate.tagName `
              --repo $env:GITHUB_REPOSITORY `
              --pattern $installerAssets[0].name `
              --dir $downloadDirectory `
              --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Downloading the previous installer from $($candidate.tagName) failed."
            }
            $previousInstaller = Join-Path $downloadDirectory $installerAssets[0].name
            Write-Host "Previous release for upgrade: $($candidate.tagName)"
            break
          }
          if ($null -eq $previousInstaller) {
            throw 'No previous release contains exactly one installer asset.'
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$previousInstaller"

      # Проверяется именно упакованный продукт: тихая установка, запуск,
      # повторная установка с тем же AppId, portable и деинсталляция.
      - name: Smoke-test packaged artifacts
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        env:
          GCODEGEN_SIGN_COMMAND: ${{ secrets.SIGN_COMMAND }}
          GCODEGEN_EXPECTED_SIGNER_THUMBPRINT: ${{ secrets.SIGNER_THUMBPRINT }}
        run: |
          $installer = (Get-ChildItem artifacts/installer/GCodeGenerator-Setup-*.exe -File -ErrorAction Stop).FullName
          $work = Join-Path $env:RUNNER_TEMP "gcodegen-package-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $smoke = @{
            InstallerPath = $installer
            PreviousInstallerPath = '${{ steps.previous.outputs.path }}'
            PortableExePath = 'artifacts/publish/GCodeGenerator/GCodeGenerator.exe'
            WorkRoot = $work
            OutputLog = 'artifacts/installer/packaged-artifact-smoke.log'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:GCODEGEN_SIGN_COMMAND)) {
            $smoke.RequireAuthenticodeSignature = $true
            $smoke.ExpectedSignerThumbprint = $env:GCODEGEN_EXPECTED_SIGNER_THUMBPRINT
          }
          build/Test-PackagedArtifacts.ps1 @smoke

      # Диагностика сохраняется и при падении smoke-теста; общий release
      # bundle ниже создаётся лишь после полностью успешной сборки.
      - name: Upload packaged artifact smoke log
        if: always() && steps.tag.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-artifact-smoke
          path: artifacts/installer/packaged-artifact-smoke.log
          if-no-files-found: error
          retention-days: 14

      - name: Create CycloneDX SBOM
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: |
          $sbom = "artifacts/installer/GCodeGenerator-$env:TAG_NAME-sbom.cdx.json"
          build/New-ReleaseSbom.ps1 `
            -Project GCodeGenerator/GCodeGenerator.csproj `
            -Version $env:TAG_NAME `
            -OutputPath $sbom

      - name: Create SHA-256 checksums
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: build/New-ReleaseChecksums.ps1 -Directory artifacts/installer

      # Описание выпуска берётся из CHANGELOG: раздел с номером версии написан
      # для пользователя, а generate_release_notes выдаёт список коммитов,
      # написанный для разработчика. Раздела для тега нет — скрипт молчит,
      # и остаётся прежнее поведение: собранный и проверенный релиз не должен
      # срываться из-за незаполненного журнала изменений.
      - name: Release notes from CHANGELOG
        if: steps.tag.outputs.skip == 'false'
        id: notes
        shell: pwsh
        run: |
          $file = 'artifacts/installer/release-notes.md'
          build/Get-ReleaseNotes.ps1 -Tag $env:TAG_NAME -OutFile $file | Out-Null
          if (Test-Path $file) {
            Write-Host "Release notes: $file"
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'found=true'
            Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$file"
          }
          else {
            Write-Host "CHANGELOG has no section for $env:TAG_NAME - falling back to generated notes."
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'found=false'
          }

      # Job публикации не получает исходный checkout, компилятор или скачанный
      # Inno Setup: через границу прав передаются только готовые файлы выпуска.
      - name: Upload release bundle
        if: steps.tag.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle
          path: artifacts/installer
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest Release Provenance
    needs: build
    if: needs.build.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: release-assets

      # Подписанная Sigstore/SLSA provenance связывает точные хеши из файла
      # с этим workflow, commit и репозиторием. Сборочный job OIDC не получает.
      - name: Attest release files
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: release-assets/SHA256SUMS.txt

  publish:
    name: Publish Release
    needs: [build, attest]
    if: needs.build.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: ${{ github.ref_name }}
          files: |
            release-assets/GCodeGenerator-Setup-*.exe
            release-assets/GCodeGenerator-*-portable.zip
            release-assets/GCodeGenerator-*-sbom.cdx.json
            release-assets/SHA256SUMS.txt
          # Тег с суффиксом (-alpha/-beta/-rc) — pre-release.
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          # Раздел CHANGELOG, если он есть; иначе — список коммитов, как раньше.
          body_path: ${{ needs.build.outputs.notes_found == 'true' && 'release-assets/release-notes.md' || '' }}
          generate_release_notes: ${{ needs.build.outputs.notes_found != 'true' }}
          fail_on_unmatched_files: true
          # Повторный push того же тега заменяет релиз, а не падает.
          overwrite: true
